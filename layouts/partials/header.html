<head>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://stats.ficwats.ca{{ .RelPermalink }}">
{{ with .OutputFormats.Get "rss" }}
  {{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{ end }}
<title> ena.rocks </title>
<link rel="icon" href="/Icon.PNG">
<meta property="og:description" content={{ .Params.desc }} >
<meta property="og:title" content={{ .Title }}>
<meta property="og:image" content="/Icon.PNG">
<meta property="og:image:secure_url" content="https://ena.rocks/">
<meta property="og:image:alt" content="A bleeding heart (flower)">
<meta property="og:type" content="image">
</head>
<header>
	<div class="main">
		<hr>
		<div class="headerbar">
				<span> <a href="/gallery/">gallery</a> </span>
				<span> <a href="/blog/">blog</a> </span>
				<span> <a href="/about/">about</a> </span>
				<span> <a href="/links/">links</a> </span>
		</div>
		<hr>
	</div>
	<a href="/">
	<img
			src="/Title.PNG"
			alt="ena.rocks with bleeding hearts (flower)"
			width="350"
			height="170"
			class="headercentre"
	>
	</a>
	<hr class="main">
	<a style="display:none" rel="me" href="https://mastodon.social/@enarocks">Mastodon</a>
</header>
