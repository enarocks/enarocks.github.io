<!DOCTYPE html>
<html lang="en" charset="utf-8">
<head> 
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://stats.ficwats.ca{{ .RelPermalink }}">
{{ with .OutputFormats.Get "rss" }}
  {{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{ end }}
<title> ena.rocks </title>
<link rel="icon" href="/Icon.PNG">
<meta property="og:description" content={{ .Params.desc }} >
<meta property="og:title" content={{ .Title }}>
<meta property="og:image" content="/Icon.PNG">
<meta property="og:image:secure_url" content="https://ena.rocks/">
<meta property="og:image:alt" content="A bleeding heart (flower)">
<meta property="og:type" content="image">
</head>
{{ partial "header.html" . }}
<body>
<div class="main">
	{{ block "main" . }}
	{{ end }}
</div>
</body>
</html>
